[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

# Per-pixel processing (keying, resampling, colour conversion) is unusably slow unoptimised.
[profile.dev.package.camlights-core]
opt-level = 3

[profile.release]
lto = "thin"
